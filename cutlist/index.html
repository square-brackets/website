<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>opticut — cutting plan</title>
<style>
:root{
  --bg:#f2efe9; --panel:#fbf9f5; --ink:#0c0c0c; --muted:#5e5b55; --line:#0c0c0c26;
  --accent:#ff3b0f; --accent-ink:#c22600; --on-accent:#0c0c0c;
  --field:#fbf9f5; --head:#e8e4da;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c0c0c; --panel:#171714; --ink:#f2efe9; --muted:#9a968e; --line:#f2efe940;
  --accent:#ff4a1c; --accent-ink:#ff4a1c; --on-accent:#0c0c0c;
  --field:#121210; --head:#1f1f1b;
}}
/* brackets.hr serves this file, and the homepage has already cached it, so it
   costs nothing there. Run this page from file:// or a USB stick and the request
   simply fails — the system stack below takes over and nothing breaks. */
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;
  src:url('/fonts/inter-var-latin.woff2') format('woff2-variations')}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:1.1rem 1.4rem .9rem;border-bottom:3px solid var(--ink);background:var(--panel)}
.home{display:inline-block;margin-bottom:.4rem;font-size:.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.14em;color:var(--accent-ink);text-decoration:none}
.home:hover{color:var(--ink)}
h1{margin:0;font-size:1.05rem;letter-spacing:.01em}
header p{margin:.25rem 0 0;color:var(--muted);font-size:.85rem}
main{display:grid;gap:1.1rem;padding:1.1rem;grid-template-columns:minmax(0,560px) minmax(0,1fr);
  align-items:start;max-width:1700px;margin:0 auto}
@media (max-width:1180px){main{grid-template-columns:minmax(0,1fr)}}
section{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:.9rem 1rem 1rem}
section h2{margin:0 0 .6rem;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.7rem;text-transform:uppercase;
  letter-spacing:.1em;padding:.3rem .35rem;border-bottom:1px solid var(--line)}
td{padding:.12rem .12rem;border-bottom:1px solid var(--line)}
td input,td select{width:100%;border:1px solid transparent;background:transparent;color:inherit;
  font:inherit;font-size:.83rem;padding:.32rem .35rem;border-radius:0;min-width:0}
td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--field)}
td input[type=number]{text-align:right}
.num{width:4.5rem}.qty{width:3rem}.grain{width:4.2rem}
td:first-child input{min-width:7rem}
.del{width:1.6rem;text-align:center}
.del button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:.2rem .3rem;border-radius:0}
.del button:hover{color:var(--accent-ink);background:var(--head)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
button.act{font:inherit;font-size:.82rem;padding:.4rem .8rem;border-radius:0;cursor:pointer;
  border:1px solid var(--line);background:var(--field);color:inherit}
button.act:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.opts label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.2rem}
.opts input,.opts select{width:100%;font:inherit;font-size:.85rem;padding:.35rem .45rem;border-radius:0;
  border:1px solid var(--line);background:var(--field);color:inherit}
.check{display:flex;align-items:center;gap:.45rem;font-size:.85rem;margin-top:.6rem}
.check input{width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.55rem;margin-bottom:.9rem}
.card{background:var(--head);border-radius:0;padding:.5rem .65rem}
.card b{display:block;font-size:1.28rem;font-weight:650;letter-spacing:-.01em}
.card span{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet{border:1px solid var(--line);border-radius:0;margin-bottom:.9rem;overflow:hidden}
.sheet>h3{margin:0;padding:.55rem .8rem;background:var(--head);font-size:.82rem;font-weight:600;
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.sheet>h3 em{font-style:normal;color:var(--muted);font-weight:400}
.draw{padding:.7rem .8rem;overflow-x:auto}
.draw svg{width:100%;height:auto;display:block;border-radius:0}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:.45rem .8rem;font-size:.78rem;color:var(--muted);user-select:none}
summary:hover{color:var(--ink)}
details .inner{padding:0 .8rem .7rem}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
.note{background:var(--head);color:var(--ink);border-left:3px solid var(--accent);padding:.6rem .8rem;font-size:.85rem;margin-bottom:.9rem}
.err{white-space:pre-wrap}
.empty{color:var(--muted);font-size:.88rem;padding:1.4rem 0;text-align:center}
textarea{width:100%;min-height:190px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:0;background:var(--field);color:inherit;padding:.55rem}
dialog{border:1px solid var(--line);border-radius:0;background:var(--panel);color:inherit;
  padding:1rem;max-width:min(660px,92vw);width:100%}
dialog::backdrop{background:#0008}
@media print{
  body{background:#fff}
  header,#inputs,summary,.row,.note-screen{display:none!important}
  main{display:block;padding:0;max-width:none}
  section{border:0;padding:0}
  .sheet{page-break-inside:avoid;break-inside:avoid;margin-bottom:1.2rem}
  details{display:block}details[open] .inner,details .inner{display:block}
}
</style>
</head>
<body>
<header>
  <a id="home" class="home" href="/" hidden>[ Brackets ]</a>
  <h1>opticut</h1>
  <p>Guillotine cutting plans for sheet goods. Everything runs in this page — nothing is uploaded.</p>
</header>

<main>
<div id="inputs">
  <section>
    <h2>Panels</h2>
    <table><thead><tr>
      <th>Name</th><th class="num">Width</th><th class="num">Height</th>
      <th class="qty">Qty</th><th class="grain">Grain</th><th class="del"></th>
    </tr></thead><tbody id="panelBody"></tbody></table>
    <div class="row">
      <button class="act" data-add="panel">+ Panel</button>
      <button class="act" data-csv="panel">CSV…</button>
      <span style="flex:1"></span>
      <span class="mono" id="panelCount"></span>
    </div>
  </section>

  <section style="margin-top:1.1rem">
    <h2>Sheet stock</h2>
    <table><thead><tr>
      <th>Name</th><th class="num">Width</th><th class="num">Height</th>
      <th class="qty">Qty</th><th class="del"></th>
    </tr></thead><tbody id="sheetBody"></tbody></table>
    <div class="row">
      <button class="act" data-add="sheet">+ Sheet</button>
      <button class="act" data-csv="sheet">CSV…</button>
      <span style="flex:1"></span>
      <span class="mono" style="color:var(--muted)">blank qty = unlimited</span>
    </div>
  </section>

  <section style="margin-top:1.1rem">
    <h2>Settings</h2>
    <div class="opts">
      <div><label for="kerf">Kerf (mm)</label><input id="kerf" type="number" step="0.1" min="0" value="3"></div>
      <div><label for="minoff">Min offcut (mm)</label><input id="minoff" type="number" step="1" min="1" value="50"></div>
      <div><label for="effort">Effort</label><select id="effort">
        <option value="0">Fast</option><option value="1">Normal</option>
        <option value="2" selected>Thorough</option></select></div>
    </div>
    <label class="check"><input id="grainFlag" type="checkbox"> Material has a grain — honour the grain column</label>
    <div class="row">
      <button class="act primary" id="run" disabled>Loading…</button>
      <button class="act" id="print">Print</button>
      <span class="mono" id="timing" style="color:var(--muted)"></span>
    </div>
  </section>
</div>

<section id="results"><div class="empty">Enter panels, then press Calculate.</div></section>
</main>

<dialog id="csvBox">
  <h2 style="margin:0 0 .5rem;font-size:.9rem" id="csvTitle">CSV</h2>
  <textarea id="csvText" spellcheck="false"></textarea>
  <div class="row">
    <button class="act primary" id="csvLoad">Replace from text</button>
    <button class="act" id="csvCopy">Copy</button>
    <span style="flex:1"></span>
    <button class="act" id="csvClose">Close</button>
  </div>
</dialog>

let wasm = null;

function boot(){
  const bin = atob(WASM_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return WebAssembly.instantiate(bytes.buffer, {}).then(r => { wasm = r.instance.exports; });
}

// µm in, JSON out. The buffer can move when the module grows its memory, so
// every view is taken fresh rather than cached across a call.
function solveJob(panelsCsv, sheetsCsv, kerfUm, grain, effort, minOffUm){
  const enc = new TextEncoder();
  const p = enc.encode(panelsCsv), s = enc.encode(sheetsCsv);
  const pp = wasm.alloc(p.length), sp = wasm.alloc(s.length || 1);
  new Uint8Array(wasm.memory.buffer).set(p, pp);
  if (s.length) new Uint8Array(wasm.memory.buffer).set(s, sp);
  const out = wasm.solve_job(pp, p.length, sp, s.length,
                             BigInt(kerfUm), grain ? 1 : 0, effort, BigInt(minOffUm));
  const len = new DataView(wasm.memory.buffer).getUint32(out, true);
  const json = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, out + 4, len));
  wasm.dealloc(out, 4 + len);
  wasm.dealloc(pp, p.length);
  wasm.dealloc(sp, s.length || 1);
  return JSON.parse(json);
}

const GRAINS = [["",  "free"], ["v", "v"], ["h", "h"]];
const state = {
  panels: [
    {name:"Door",  w:"600", h:"720", qty:"4", grain:""},
    {name:"Shelf", w:"560", h:"300", qty:"6", grain:""},
  ],
  sheets: [{name:"Default", w:"2800", h:"2070", qty:""}],
};

try {
  const saved = localStorage.getItem("opticut");
  if (saved) {
    const o = JSON.parse(saved);
    if (o.panels?.length) state.panels = o.panels;
    if (o.sheets?.length) state.sheets = o.sheets;
    if (o.opts) {
      kerf.value = o.opts.kerf; minoff.value = o.opts.minoff;
      effort.value = o.opts.effort; grainFlag.checked = o.opts.grain;
    }
  }
} catch (e) { /* private window, blocked storage — defaults are fine */ }

function save(){
  try {
    localStorage.setItem("opticut", JSON.stringify({
      panels: state.panels, sheets: state.sheets,
      opts: {kerf: kerf.value, minoff: minoff.value, effort: effort.value, grain: grainFlag.checked},
    }));
  } catch (e) {}
}

// A column <th> does not give an input an accessible name — a screen reader
// sitting on the field would announce nothing. Each generated field therefore
// carries its own aria-label, and a name so it is a real form field.
const FIELD_LABEL = {name: "name", w: "width in mm", h: "height in mm", qty: "quantity"};

function cell(row, key, cls, type, ns, idx){
  const td = document.createElement("td");
  const el = document.createElement("input");
  el.className = cls || ""; el.value = row[key] ?? "";
  if (type) { el.type = type; el.step = "0.001"; }
  el.name = `${ns}-${key}-${idx}`;
  el.setAttribute("aria-label", `${ns} ${FIELD_LABEL[key]}, row ${idx + 1}`);
  el.title = el.value;
  el.oninput = () => { row[key] = el.value; el.title = el.value; save(); };
  td.appendChild(el); return td;
}

function grainCell(row, idx){
  const td = document.createElement("td");
  const sel = document.createElement("select");
  sel.className = "grain";
  sel.name = `panel-grain-${idx}`;
  sel.setAttribute("aria-label", `panel grain direction, row ${idx + 1}`);
  for (const [v, label] of GRAINS) {
    const o = document.createElement("option");
    o.value = v; o.textContent = label; if (row.grain === v) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => { row.grain = sel.value; save(); };
  td.appendChild(sel); return td;
}

function delCell(list, row, render, ns, idx){
  const td = document.createElement("td");
  td.className = "del";
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = "×"; b.title = "Remove";
  // Without this the button's accessible name is the bare glyph "×".
  b.setAttribute("aria-label", `remove ${ns} row ${idx + 1}`);
  b.onclick = () => { list.splice(list.indexOf(row), 1); render(); save(); };
  td.appendChild(b); return td;
}

function renderPanels(){
  panelBody.replaceChildren();
  for (const [i, row] of state.panels.entries()) {
    const tr = document.createElement("tr");
    tr.append(cell(row,"name",null,null,"panel",i),
              cell(row,"w","num","number","panel",i),
              cell(row,"h","num","number","panel",i),
              cell(row,"qty","qty","number","panel",i),
              grainCell(row,i),
              delCell(state.panels, row, renderPanels, "panel", i));
    panelBody.appendChild(tr);
  }
  const total = state.panels.reduce((n, r) => n + (parseInt(r.qty) || 0), 0);
  panelCount.textContent = state.panels.length + " rows / " + total + " panels";
}

function renderSheets(){
  sheetBody.replaceChildren();
  for (const [i, row] of state.sheets.entries()) {
    const tr = document.createElement("tr");
    tr.append(cell(row,"name",null,null,"sheet",i),
              cell(row,"w","num","number","sheet",i),
              cell(row,"h","num","number","sheet",i),
              cell(row,"qty","qty",null,"sheet",i),
              delCell(state.sheets, row, renderSheets, "sheet", i));
    sheetBody.appendChild(tr);
  }
}

const csvEsc = v => /[",;]/.test(v ?? "") ? '"' + String(v).replace(/"/g, '""') + '"' : (v ?? "");

// Panel and sheet names are typed by the user and end up inside innerHTML in
// renderResult(). Escape them there, for the same reason report::svg::escape()
// exists on the Rust side. Note: sh.svg is NOT escaped — that markup comes from
// the engine, which already escapes the names it embeds.
const ESC = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC[c]);
const panelsCsv = () => "name,width,height,quantity,grain\n" +
  state.panels.map(r => [csvEsc(r.name), r.w, r.h, r.qty || 1, r.grain].join(",")).join("\n");
const sheetsCsv = () => "name,width,height,quantity\n" +
  state.sheets.map(r => [csvEsc(r.name), r.w, r.h, r.qty].join(",")).join("\n");

// Deliberately forgiving: the point is to paste a file that already exists.
function parseCsv(text, kind){
  const out = [];
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#"));
  if (!lines.length) return out;
  const split = l => {
    const f = []; let cur = "", q = false;
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (c === '"' && q && l[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = !q;
      else if ((c === "," || c === ";") && !q) { f.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    f.push(cur.trim()); return f;
  };
  const head = split(lines[0]).map(h => h.toLowerCase());
  const known = ["name","width","height","quantity","qty","grain"];
  const hasHead = head.some(h => known.includes(h));
  const at = names => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const ci = hasHead
    ? {name: at(["name"]), w: at(["width","w"]), h: at(["height","h"]),
       qty: at(["quantity","qty","count"]), grain: at(["grain","direction"])}
    : {name: 0, w: 1, h: 2, qty: 3, grain: -1};
  for (const line of lines.slice(hasHead ? 1 : 0)) {
    const f = split(line);
    const pick = i => (i >= 0 ? (f[i] ?? "") : "");
    const row = {name: pick(ci.name), w: pick(ci.w), h: pick(ci.h), qty: pick(ci.qty)};
    if (kind === "panel") row.grain = pick(ci.grain).toLowerCase();
    if (row.name && row.w && row.h) out.push(row);
  }
  return out;
}

let csvKind = "panel";
for (const b of document.querySelectorAll("[data-csv]")) b.onclick = () => {
  csvKind = b.dataset.csv;
  csvTitle.textContent = csvKind === "panel" ? "Panels CSV" : "Sheet stock CSV";
  csvText.value = csvKind === "panel" ? panelsCsv() : sheetsCsv();
  csvBox.showModal();
};
csvClose.onclick = () => csvBox.close();
csvCopy.onclick = () => navigator.clipboard?.writeText(csvText.value);
csvLoad.onclick = () => {
  const rows = parseCsv(csvText.value, csvKind);
  if (!rows.length) return alert("Nothing recognised in that text.");
  if (csvKind === "panel") { state.panels = rows; renderPanels(); }
  else { state.sheets = rows; renderSheets(); }
  save(); csvBox.close();
};

for (const b of document.querySelectorAll("[data-add]")) b.onclick = () => {
  if (b.dataset.add === "panel") { state.panels.push({name:"", w:"", h:"", qty:"1", grain:""}); renderPanels(); }
  else { state.sheets.push({name:"", w:"", h:"", qty:""}); renderSheets(); }
  save();
};

const um = v => Math.round(parseFloat(v || 0) * 1000);
const fmt = (n, d) => Number(n).toFixed(d ?? 0);

function card(value, label){ return `<div class="card"><b>${value}</b><span>${label}</span></div>`; }

function renderResult(r, ms){
  if (!r.ok) {
    results.innerHTML = `<div class="note err"><b>Could not build a plan</b>\n${esc(r.error)}</div>`;
    return;
  }
  const s = r.summary;
  let html = `<div class="cards">
    ${card(s.sheets, "sheets")}
    ${card(s.placed + " / " + s.total, "panels")}
    ${card(s.cuts, "cuts")}
    ${card(fmt(s.cutLength / 1000, 2) + " m", "cut length")}
    ${card(fmt(s.utilisation * 100, 1) + " %", "used")}
    ${card(fmt(s.wasteArea, 2) + " m²", "waste")}</div>`;

  if (r.unplaced.length) {
    html += `<div class="note"><b>${r.unplaced.reduce((n,u)=>n+u.count,0)} panel(s) did not fit</b><br>` +
      r.unplaced.map(u => `${u.count} × ${esc(u.name)} — ${u.w} × ${u.h} mm`).join("<br>") + `</div>`;
  }
  if (s.preserveGrain) {
    html += `<div class="note note-screen" style="background:var(--head);color:var(--muted)">` +
      `Grain runs along the sheet width; ${s.pinned} of ${s.total} panels pinned to it.</div>`;
  }

  r.sheets.forEach((sh, i) => {
    html += `<div class="sheet"><h3><span>Sheet ${i+1} — ${esc(sh.name)} ${sh.width} × ${sh.height} mm</span>
      <em>${fmt(sh.utilisation*100,1)} % used · ${sh.cuts} cuts · ${fmt(sh.cutLength/1000,2)} m</em></h3>
      <div class="draw">${sh.svg}</div>
      <details><summary>Panel positions (${sh.placements.length})</summary><div class="inner">
        <table class="mono"><thead><tr><th>Panel</th><th class="num">x</th><th class="num">y</th>
        <th class="num">Width</th><th class="num">Height</th><th></th></tr></thead><tbody>` +
        sh.placements.map(p => `<tr><td>${esc(p.name)} #${p.instance}</td><td class="num">${p.x}</td>
          <td class="num">${p.y}</td><td class="num">${p.w}</td><td class="num">${p.h}</td>
          <td>${p.rotated ? "turned" : ""}</td></tr>`).join("") +
        (sh.offcuts.length ? sh.offcuts.map(o => `<tr style="color:var(--muted)"><td>offcut</td>
          <td class="num">${o.x}</td><td class="num">${o.y}</td><td class="num">${o.w}</td>
          <td class="num">${o.h}</td><td></td></tr>`).join("") : "") +
        `</tbody></table></div></details>
      <details><summary>Cut sequence (${sh.cutList.length})</summary><div class="inner">
        <table class="mono"><thead><tr><th>#</th><th>Stage</th><th>Direction</th>
        <th class="num">At</th><th class="num">From</th><th class="num">Length</th></tr></thead><tbody>` +
        sh.cutList.map((c, n) => `<tr><td>${n+1}</td><td>${c.stage}</td><td>${c.axis}</td>
          <td class="num">${c.pos}</td><td class="num">${c.start}</td><td class="num">${c.length}</td></tr>`).join("") +
        `</tbody></table></div></details></div>`;
  });

  results.innerHTML = html;
  // The SVGs carry height="100%"; inside a flowing page they want intrinsic height.
  for (const svg of results.querySelectorAll(".draw svg")) svg.removeAttribute("height");
  timing.textContent = ms.toFixed(0) + " ms";
}

run.onclick = () => {
  save();
  if (!wasm) return;
  const t0 = performance.now();
  let r;
  try {
    r = solveJob(panelsCsv(), sheetsCsv(), um(kerf.value), grainFlag.checked,
                 parseInt(effort.value), um(minoff.value));
  } catch (e) {
    r = {ok: false, error: String(e)};
  }
  renderResult(r, performance.now() - t0);
};
print.onclick = () => window.print();
for (const el of [kerf, minoff, effort, grainFlag]) el.onchange = save;

// Only offer the way back when there is a site to go back to. From file:// or a
// USB stick "/" is the filesystem root, so the link stays hidden.
if (location.protocol === "http:" || location.protocol === "https:") {
  document.getElementById("home").hidden = false;
}

renderPanels(); renderSheets();
boot().then(() => { run.disabled = false; run.textContent = "Calculate"; })
      .catch(e => { results.innerHTML = `<div class="note err">WebAssembly failed to load:\n${esc(e)}</div>`; });
</script>
</body>
</html>
